plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
repositories {
    mavenCentral()
}

dependencies {
    // Optional server-only integration: not bundled in the Raven Correio jar.
    compileOnly 'net.luckperms:api:5.4'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        ravencorreio { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
